<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mobile player mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Barlow:wght@500;600&display=swap" rel="stylesheet" />
<!-- Approved direction (concept A) for the phone full-screen player, not
     built yet. Spectrum is the hero; frequency ticks stay in a strip under
     it (45 Hz to 9 kHz, log scale, matching the real analyser in
     PlayerBar.astro); title has no glow; the track code (e.g. A06-T04 =
     album 6, track 4) is shown glitched and is decorative. Track text and
     bar heights are placeholders. -->
<style>
body{margin:0;padding:24px 16px;background:#1a1d27;font-family:system-ui,sans-serif;color:#c9c2ad}
.wrap{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.ph{width:260px;height:520px;background:#0b0e16;border-radius:14px;overflow:hidden;position:relative;font-family:'Chakra Petch',sans-serif;color:#ece3cb;flex:none;display:flex;flex-direction:column}
.nv{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #1d2230;font-size:9px;letter-spacing:.14em;color:#9a9789}
.st{width:14px;height:14px;background:repeating-linear-gradient(-45deg,#e8c547 0 3px,transparent 3px 6px)}
.bc{height:16px;width:60px;flex:none;background:repeating-linear-gradient(90deg,#c9c2ad 0 1px,transparent 1px 3px,#c9c2ad 3px 5px,transparent 5px 6px,#c9c2ad 6px 7px,transparent 7px 10px)}
.z{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9a9789;line-height:1;white-space:nowrap}
.viz{display:flex;gap:2px;align-items:flex-end}
.col{flex:1;display:flex;flex-direction:column-reverse;gap:2px}
.col i{display:block;height:4px;background:#5f8a5f}
.col i.off{background:#1a1e2a}
.col i.pk{background:#ece3cb}
.ax{position:relative;height:22px;border-top:1px solid #2a2e3b;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#7d7a6e}
.ax em{position:absolute;top:0;width:1px;height:5px;background:#4a4c55}
.ax span{position:absolute;top:8px;transform:translateX(-50%);white-space:nowrap;font-style:normal}
.ttl{font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.sub{font-family:'Barlow',sans-serif;font-size:11px;color:#9a9789}
.seek{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#9a9789}
.trk{flex:1;height:3px;background:#262a38;position:relative}
.trk b{position:absolute;left:0;top:0;bottom:0;width:22%;background:#e5482f}
.tp{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:2px;height:46px;flex:none}
.tp span{background:#1f2333;display:flex;align-items:center;justify-content:center;font-size:12px}
.tp .pl{background:#e5482f}
.back{width:30px;height:30px;background:#c4432f;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.lb{font-size:13px;margin-top:10px;text-align:center;max-width:260px}
</style>
</head>
<body>
<div class="wrap">

<div><div class="ph">
<div class="nv"><span class="st"></span><span>ARCHIVES&nbsp;&nbsp;ABOUT</span></div>
<div style="flex:1;display:flex;flex-direction:column;padding:10px 12px 0">
<div style="display:flex;align-items:center;gap:8px"><span class="back">‹</span><span style="flex:1"></span><span class="bc"></span><span class="z">A̸̢̛͙0̷̨̧̛6̶̡̛-̵̢͎T̷̨̛0̸̡̛4̷̢̧</span></div>
<div class="viz" id="vA" style="flex:1;margin-top:12px"></div>
<div class="ax" id="axA" style="margin-top:4px"></div>
</div>
<div style="padding:10px 12px 0">
<div class="ttl" style="font-size:22px">The Other Promise (Su…</div>
<div class="sub" style="margin-top:4px">2016 · track 4 of 7</div>
<div class="seek" style="margin-top:12px">0:04<span class="trk"><b></b></span>10:06</div>
</div>
<div class="tp" style="margin:12px"><span>⏮</span><span class="pl">❚❚</span><span>⏭</span></div>
</div><div class="lb">Ticks stay in the axis strip; title has no glow</div></div>

<div style="display:flex;flex-direction:column;justify-content:center;gap:10px;max-width:260px">
<div style="background:#0b0e16;border-radius:10px;padding:14px 12px 10px">
<div class="viz" id="vZ" style="height:90px"></div>
<div class="ax" id="axZ" style="margin-top:4px"></div>
</div>
<div class="lb" style="margin-top:0">Close-up: a short tick under each frequency, nothing drawn through the bars</div>
</div>

</div>
<script>
var F0=45,F1=9000,LBL=[[50,'50'],[100,'100'],[250,'250'],[500,'500'],[1000,'1k'],[2000,'2k'],[4000,'4k'],[8000,'8k Hz']];
function pos(f){return Math.log(f/F0)/Math.log(F1/F0)}
function build(v,ax,n,h,seed){
  for(var c=0;c<n;c++){
    var col=document.createElement('div');col.className='col';
    var x=c/(n-1);
    var lvl=Math.round(h*(0.22+0.62*Math.pow(1-x,1.1)*(0.55+0.45*Math.abs(Math.sin(c*1.7+seed)))));
    var pk=Math.min(h-1,lvl+1+(c*7+seed)%3);
    for(var r=0;r<h;r++){var b=document.createElement('i');if(r===pk)b.className='pk';else if(r>=lvl)b.className='off';col.appendChild(b)}
    v.appendChild(col);
  }
  LBL.forEach(function(l,k){
    var p=pos(l[0])*100;
    var t=document.createElement('em');t.style.left=p+'%';ax.appendChild(t);
    var s=document.createElement('span');s.textContent=l[1];s.style.left=p+'%';
    if(k===0)s.style.transform='translateX(-20%)';
    if(k===LBL.length-1)s.style.transform='translateX(-80%)';
    ax.appendChild(s);
  });
}
build(document.getElementById('vA'),document.getElementById('axA'),24,24,1);
build(document.getElementById('vZ'),document.getElementById('axZ'),24,14,3);
</script>
</body>
</html>
