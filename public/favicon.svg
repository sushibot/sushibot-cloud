<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0B0E16" />
  <defs>
    <pattern id="stripe" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="20" height="20" fill="none" />
      <rect width="10" height="20" fill="#E8C547" />
    </pattern>
  </defs>
  <rect width="32" height="32" fill="url(#stripe)" />
</svg>
