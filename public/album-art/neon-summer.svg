<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title description">
  <title id="title">Neon Summer album cover</title>
  <desc id="description">A neon sun over a dark horizon</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17133f" />
      <stop offset="0.55" stop-color="#7b237c" />
      <stop offset="1" stop-color="#f16a5b" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff06a" />
      <stop offset="1" stop-color="#ff9f43" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#sky)" />
  <circle cx="400" cy="390" r="180" fill="url(#sun)" />
  <path d="M0 610 160 540 280 590 410 500 560 585 680 520 800 580V800H0Z" fill="#11132b" />
  <path d="M0 666 140 620 290 670 450 600 610 665 800 620V800H0Z" fill="#080a1c" />
  <text x="400" y="125" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="12" text-anchor="middle">NEON</text>
  <text x="400" y="190" fill="#fff" font-family="Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="12" text-anchor="middle">SUMMER</text>
</svg>
